# ==============================================================================
# KnowFlow AI - Production Docker Compose Orchestration
# ==============================================================================
# Usage:
#   Direct deployment:
#     docker compose -f docker-compose.prod.yml up --build -d
#
#   With optional Nginx reverse proxy profile:
#     docker compose -f docker-compose.prod.yml --profile with-nginx up --build -d
#
#   With optional local Postgres + pgvector database:
#     docker compose -f docker-compose.prod.yml --profile local-db up --build -d
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI + Python 3.11-slim)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowflow-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8000
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - CORS_ORIGINS=["${FRONTEND_URL:-http://localhost:3000}"]
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - knowflow-network

  # ----------------------------------------------------------------------------
  # Frontend Application (Next.js 14 Standalone)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - knowflow-network

  # ----------------------------------------------------------------------------
  # Optional Profile: Nginx Reverse Proxy (SSL / Ingress)
  # Activated with: --profile with-nginx
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: knowflow-nginx
    restart: unless-stopped
    profiles:
      - with-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - knowflow-network

  # ----------------------------------------------------------------------------
  # Optional Profile: Local PostgreSQL + pgvector for offline validation
  # Activated with: --profile local-db
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowflow-postgres
    restart: unless-stopped
    profiles:
      - local-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=knowflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - knowflow-network

networks:
  knowflow-network:
    driver: bridge

volumes:
  pgdata:
